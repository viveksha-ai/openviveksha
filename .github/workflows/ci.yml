name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Pin actions to a full commit SHA (supply-chain integrity), not a
      # mutable tag. Bump the SHA deliberately when upgrading.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Typecheck (strict)
        run: npx tsc --noEmit
      - name: Tests (laws + platform)
        run: npm test
      - name: Build
        run: npm run build
      - name: Quickstart smoke — MCP surface works from a clean build
        run: node examples/demo.mjs --no-llm
